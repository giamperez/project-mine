name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-y-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de @suite/core (formulas de ingenieria)
        run: npm run test --workspace=@suite/core

      - name: "Tests de @suite/engine (IO de formatos: DXF, LAS/LAZ, KML, UTM)"
        run: npm run test --workspace=@suite/engine

      - name: Build de @suite/web (typecheck + vite build)
        run: npm run build:web

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Suite de regresion E2E
        run: npm run e2e
        working-directory: apps/web

      - name: Subir reporte de Playwright si algo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
